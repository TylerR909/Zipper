name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # BigWigs manual-changelog uploads the whole file. Copy only this tag's
      # ## <version> body into RELEASE_NOTES.md for the packager.
      - name: Release notes for this tag
        run: |
          version=${GITHUB_REF_NAME#v}
          copying=
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            case "$line" in
              "## "*)
                if [ -n "$copying" ]; then
                  break
                fi
                heading=${line#\#\# }
                heading=${heading#v}
                heading=${heading%%[ $'\t']*}
                if [ "$heading" = "$version" ]; then
                  copying=1
                fi
                ;;
              *)
                if [ -n "$copying" ]; then
                  printf '%s\n' "$line"
                fi
                ;;
            esac
          done < CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no notes under '## $version'."
            exit 1
          fi
          echo "Release notes for $GITHUB_REF_NAME:"
          cat RELEASE_NOTES.md
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
